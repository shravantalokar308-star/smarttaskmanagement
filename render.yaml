services:
  - type: web
    name: synapse-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # User will input their MongoDB Connection URI in the Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure JWT secret
      - key: FRONTEND_URL
        sync: false # User will input their Vercel Frontend URL here
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false # User's Gmail address
      - key: SMTP_PASSWORD
        sync: false # User's Gmail App Password
      - key: SMTP_FROM
        value: "Synapse Workspace <no-reply@synapse.com>"
